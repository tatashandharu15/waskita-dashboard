<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Waskita Analytics</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231d4ed8' stroke-width='2.5'><rect x='3' y='11' width='18' height='11' rx='2'/><path d='M7 11V7a5 5 0 0 1 10 0v4'/></svg>" />
<link rel="stylesheet" href="/static/css/dashboard.css">
<style>
  body {
    min-height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(1200px 600px at 10% -10%, color-mix(in srgb, var(--primary) 18%, transparent), transparent 60%),
      radial-gradient(900px 500px at 110% 110%, color-mix(in srgb, var(--accent-purple) 14%, transparent), transparent 60%),
      var(--bg);
    color: var(--fg);
    font-family: var(--font-sans);
  }
  .login-wrap {
    width: min(440px, 92vw);
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    box-shadow: var(--shadow-xl);
    padding: 30px 32px 26px;
    position: relative;
    overflow: hidden;
  }
  .login-wrap::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--primary), var(--accent-purple), var(--accent-pink));
  }
  .brand-row {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 18px;
  }
  .brand-mark {
    width: 42px; height: 42px; border-radius: 12px;
    background: linear-gradient(135deg, var(--primary), var(--accent-purple));
    display: flex; align-items: center; justify-content: center;
    color: white; box-shadow: var(--shadow-md);
  }
  .brand-mark svg { width: 22px; height: 22px; }
  .title { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
  .subtitle { margin: 2px 0 0; font-size: 13.5px; color: var(--fg-muted); }
  .label {
    display: block; margin: 22px 0 8px;
    font-size: 13px; font-weight: 700; color: var(--fg-subtle); letter-spacing: 0.01em;
  }
  .input-wrap { position: relative; }
  .secret-input {
    width: 100%;
    padding: 14px 44px 14px 14px;
    border-radius: 12px;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    color: var(--fg);
    font-size: 14.5px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .secret-input:focus {
    border-color: color-mix(in srgb, var(--primary) 70%, transparent);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 16%, transparent);
    background: var(--input-bg-focus, var(--input-bg));
  }
  .toggle-eye {
    position: absolute;
    right: 10px; top: 50%; transform: translateY(-50%);
    width: 32px; height: 32px; border: none; background: transparent;
    color: var(--fg-muted); cursor: pointer;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s ease, color .15s ease;
  }
  .toggle-eye:hover { background: color-mix(in srgb, var(--fg) 6%, transparent); color: var(--fg); }
  .btn-login {
    width: 100%; margin-top: 18px;
    padding: 13px 16px;
    border-radius: 12px; border: none;
    background: linear-gradient(135deg, var(--primary), color-mix(in srgb, var(--primary) 65%, var(--accent-purple)));
    color: white; font-weight: 700; font-size: 14.5px; letter-spacing: 0.01em;
    cursor: pointer;
    box-shadow: 0 10px 22px -10px color-mix(in srgb, var(--primary) 60%, transparent);
    transition: transform .12s ease, box-shadow .2s ease, filter .2s ease;
  }
  .btn-login:hover { transform: translateY(-1px); filter: brightness(1.03); box-shadow: 0 14px 26px -10px color-mix(in srgb, var(--primary) 65%, transparent); }
  .btn-login:active { transform: translateY(0); }
  .btn-login:disabled { opacity: .7; cursor: progress; transform: none; }
  .help-box {
    margin-top: 20px;
    padding: 12px 14px;
    border-radius: 12px;
    background: color-mix(in srgb, var(--warning) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--warning) 28%, transparent);
    font-size: 12.5px; line-height: 1.55; color: var(--fg);
  }
  .help-box b { color: var(--warning-contrast, #92400e); }
  .help-box ol { margin: 6px 0 0 18px; padding: 0; }
  .help-box li { margin: 2px 0; }
  .help-box code {
    background: rgba(0,0,0,.06); padding: 2px 6px; border-radius: 6px;
    font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .toast {
    position: fixed; top: 20px; right: 20px;
    min-width: 260px; max-width: 90vw;
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 13.5px; font-weight: 600;
    box-shadow: var(--shadow-xl);
    z-index: 9999;
    transform: translateY(-12px); opacity: 0; pointer-events: none;
    transition: transform .25s ease, opacity .25s ease;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.error { background: #7f1d1d; color: #fff; border: 1px solid #b91c1c; }
  .toast.success { background: #065f46; color: #fff; border: 1px solid #047857; }
  .toast.info { background: var(--primary); color: #fff; border: 1px solid color-mix(in srgb, var(--primary) 80%, #000); }
  .vercel-tag {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 8px; border-radius: 999px;
    background: color-mix(in srgb, var(--fg) 5%, transparent);
    border: 1px solid color-mix(in srgb, var(--fg) 12%, transparent);
    font-size: 11px; color: var(--fg-subtle); font-weight: 600;
    margin-left: auto;
  }
</style>
</head>
<body>
  <div class="login-wrap" role="main" aria-label="Admin Login">
    <div class="brand-row">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <div>
        <h1 class="title">Waskita Admin Login</h1>
        <p class="subtitle">Dashboard Analytics — Upload Report Excel</p>
      </div>
      <span class="vercel-tag" id="envTag">{{ IS_VERCEL_TAG }}</span>
    </div>

    <form id="loginForm" autocomplete="off" onsubmit="return false;">
      <label class="label" for="secretInput">ADMIN_SECRET (copy dari Vercel Settings)</label>
      <div class="input-wrap">
        <input id="secretInput" class="secret-input" type="password" placeholder="waskita-2026-..."
               autocomplete="off" spellcheck="false" autocapitalize="off" autocorrect="off" inputmode="text" />
        <button type="button" class="toggle-eye" id="toggleEye" aria-label="Tampilkan/sembunyikan secret">
          <svg id="eyeIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <button type="submit" class="btn-login" id="btnLogin">
        <span id="btnText">Masuk ke Panel Admin</span>
      </button>
    </form>

    <div class="help-box">
      <div><b>Tidak ingat ADMIN_SECRET?</b> Copy dari Vercel Project Settings:</div>
      <ol>
        <li>Buka <code>Project Settings → Environment Variables</code></li>
        <li>Cari variable key = <code>ADMIN_SECRET</code></li>
        <li>Klik 👁 <code>Show value</code> → copy → paste diatas</li>
      </ol>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  window.__IS_VERCEL__ = {{ IS_VERCEL_BOOL }};
  (function(){
    "use strict";
    try {
      if (typeof window.__IS_VERCEL__ !== 'undefined' && window.__IS_VERCEL__) {
        document.getElementById('envTag').textContent = 'Production Vercel';
      }
    } catch (_e) {}
    const $ = (id) => document.getElementById(id);
    const form = $('loginForm');
    const input = $('secretInput');
    const btn = $('btnLogin');
    const btnText = $('btnText');
    const eyeBtn = $('toggleEye');
    const eyeIcon = $('eyeIcon');
    const toastEl = $('toast');
    const STORAGE_KEY = 'ADMIN_SECRET_LAST';
    const EYE_OPEN = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    const EYE_OFF = '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.4 20.4 0 0 1 4.22-5.19"/><path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a20.45 20.45 0 0 1-3.17 4.19"/><path d="M1 1l22 22"/><path d="M14.12 14.12A3 3 0 1 1 9.88 9.88"/>';
    let pwdShown = false;

    eyeBtn.addEventListener('click', () => {
      pwdShown = !pwdShown;
      input.type = pwdShown ? 'text' : 'password';
      eyeIcon.innerHTML = pwdShown ? EYE_OFF : EYE_OPEN;
    });

    try {
      const last = localStorage.getItem(STORAGE_KEY);
      if (last) input.value = last;
    } catch (_e) {}

    function showToast(kind, title, msg) {
      toastEl.className = 'toast ' + kind;
      toastEl.textContent = msg ? (title + ': ' + msg) : title;
      requestAnimationFrame(() => toastEl.classList.add('show'));
      setTimeout(() => toastEl.classList.remove('show'), 3200);
    }

    function submitLogin(secret) {
      const s = (secret || '').trim();
      if (!s) {
        showToast('error', 'Secret kosong', 'Isi ADMIN_SECRET terlebih dahulu');
        return;
      }
      btn.disabled = true;
      const old = btnText.textContent;
      btnText.textContent = 'Mengarahkan...';
      try { localStorage.setItem(STORAGE_KEY, s); } catch (_e) {}
      showToast('info', 'Memproses', 'Redirect ke panel admin...');
      setTimeout(() => {
        window.location.assign(`/admin/${encodeURIComponent(s)}`);
      }, 350);
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      submitLogin(input.value);
    });
  })();
</script>
</body>
</html>
